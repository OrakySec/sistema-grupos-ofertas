version: '3.8'

services:
  frontend:
    image: ghcr.io/orakysec/sistema-grupos-ofertas-frontend:latest
    depends_on:
      - api
    networks:
      - ofertas_net
      - YkaroNET
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=YkaroNET"
        - "traefik.http.routers.ofertas-frontend.rule=Host(`ofertas.ykaromarques.com`)"
        - "traefik.http.routers.ofertas-frontend.entrypoints=websecure"
        - "traefik.http.routers.ofertas-frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ofertas-frontend.loadbalancer.server.port=80"

  api:
    image: ghcr.io/orakysec/sistema-grupos-ofertas-api:latest
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${API_PORT:-3001}
      NODE_ENV: production
      MEDIA_BASE_PATH: /app/media
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    volumes:
      - media_data:/app/media
    networks:
      - ofertas_net
      - YkaroNET
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=YkaroNET"
        - "traefik.http.routers.ofertas-api.rule=Host(`ofertas.ykaromarques.com`) && PathPrefix(`/api`)"
        - "traefik.http.routers.ofertas-api.entrypoints=websecure"
        - "traefik.http.routers.ofertas-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.middlewares.ofertas-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.routers.ofertas-api.middlewares=ofertas-api-strip"
        - "traefik.http.services.ofertas-api.loadbalancer.server.port=3001"

  worker:
    image: ghcr.io/orakysec/sistema-grupos-ofertas-worker:latest
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NODE_ENV: production
      MEDIA_BASE_PATH: /app/media
    volumes:
      - media_data:/app/media
    networks:
      - ofertas_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  telegram-listener:
    image: ghcr.io/orakysec/sistema-grupos-ofertas-telegram-listener:latest
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:3001
      MEDIA_BASE_PATH: /app/media
      SESSION_PATH: /app/sessions
    volumes:
      - media_data:/app/media
      - telegram_sessions:/app/sessions
    networks:
      - ofertas_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofertas_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofertas_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:
  media_data:
  telegram_sessions:

networks:
  ofertas_net:
    driver: overlay
    attachable: true
  YkaroNET:
    external: true
