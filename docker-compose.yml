version: '3.8'

services:
  # ─────────────────────────────────────────
  # Frontend React (servido pelo Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ofertas_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - ofertas_net

  # ─────────────────────────────────────────
  # Backend API (Fastify + Prisma)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ofertas_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${API_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
      MEDIA_BASE_PATH: /app/media
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    volumes:
      - media_data:/app/media
    ports:
      - "3001:3001"
    networks:
      - ofertas_net

  # ─────────────────────────────────────────
  # BullMQ Worker (processa e envia ofertas)
  # ─────────────────────────────────────────
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    container_name: ofertas_worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: ${NODE_ENV:-development}
      MEDIA_BASE_PATH: /app/media
    volumes:
      - media_data:/app/media
    networks:
      - ofertas_net

  # ─────────────────────────────────────────
  # Telegram Listener (Python / Telethon)
  # ─────────────────────────────────────────
  telegram-listener:
    build:
      context: ./telegram-listener
      dockerfile: Dockerfile
    container_name: ofertas_telegram_listener
    restart: unless-stopped
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:3001
      MEDIA_BASE_PATH: /app/media
      SESSION_PATH: /app/sessions
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - media_data:/app/media
      - telegram_sessions:/app/sessions
    networks:
      - ofertas_net

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ofertas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofertas_net

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ofertas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofertas_net

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  media_data:
  telegram_sessions:

# ─────────────────────────────────────────
# Rede interna
# ─────────────────────────────────────────
networks:
  ofertas_net:
    driver: bridge
