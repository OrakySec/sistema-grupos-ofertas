name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: orakysec/sistema-grupos-ofertas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. API
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Worker
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Telegram Listener
      - name: Build and push Telegram Listener image
        uses: docker/build-push-action@v5
        with:
          context: ./telegram-listener
          file: ./telegram-listener/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-telegram-listener:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Frontend
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
